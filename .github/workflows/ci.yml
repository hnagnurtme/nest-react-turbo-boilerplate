name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  NODE_VERSION: '22'

jobs:
  # ── 1. Code Quality & Format ───────────────────────────────────────────────
  quality:
    name: 'CI: Code Quality'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check code formatting
        run: pnpm format:check

      - name: Lint codebase
        run: pnpm lint

      - name: Validate environment schemas
        run: pnpm check:env

  # ── 2. Typecheck ────────────────────────────────────────────────────────────
  typecheck:
    name: 'CI: Type Safety'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck all workspaces
        run: pnpm typecheck

      - name: Typecheck repository scripts
        run: pnpm exec tsc --noEmit --project scripts/tsconfig.json

  # ── 3. Unit Tests (In-memory, fast signal without infrastructure) ───────────
  test-unit:
    name: 'CI: Unit Tests'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test

  # ── 4. Security Audit & Secret Detection ───────────────────────────────────
  security:
    name: 'CI: Security & Audit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 5. Integration Tests (Requires real Postgres & Redis services) ──────────
  test-integration:
    name: 'CI: Integration Tests & RLS'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_db
      DATABASE_MIGRATION_URL: postgres://postgres:postgres@localhost:5432/test_db
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret-not-used-outside-ci
      JWT_REFRESH_SECRET: ci-refresh-secret-not-used-outside-ci
      INTERNAL_HMAC_SECRET: ci-hmac-secret-not-used-outside-ci

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @repo/shared build

      - name: Apply database migrations
        run: pnpm db:migrate

      - name: Check schema migration drift
        run: |
          pnpm db:generate
          git add --intent-to-add apps/api/drizzle
          git diff --exit-code apps/api/drizzle || {
            echo "::error::The Drizzle schema changed but no migration was generated for it."
            echo "::error::Run 'pnpm db:generate' locally, review the SQL, and commit apps/api/drizzle."
            exit 1
          }

      - name: Run integration tests
        run: pnpm test:integration

      - name: Enforce coverage thresholds
        run: pnpm exec tsx scripts/check-coverage.ts

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: apps/api/coverage
          if-no-files-found: ignore
          retention-days: 7

  # ── 6. OpenAPI Contract Drift Check ─────────────────────────────────────────
  contract-sync:
    name: 'CI: OpenAPI Contract Sync'
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_db
      DATABASE_MIGRATION_URL: postgres://postgres:postgres@localhost:5432/test_db
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret-not-used-outside-ci
      JWT_REFRESH_SECRET: ci-refresh-secret-not-used-outside-ci

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @repo/shared build

      - name: Verify contract has not drifted
        run: |
          pnpm --filter @repo/api generate:openapi
          pnpm --filter @repo/api-contract generate
          git add --intent-to-add .
          git diff --exit-code || {
            echo "::error::The committed OpenAPI spec or generated client is out of date."
            echo "::error::Run 'pnpm api:contract' locally and commit the result."
            exit 1
          }

  # ── 7. Build Container Images (Parallel Matrix Build) ───────────────────────
  build:
    name: 'CI: Build Image (${{ matrix.app }})'
    needs: [quality, typecheck, test-unit, security, test-integration, contract-sync]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
            file: apps/api/Dockerfile
            context: .
          - app: web
            file: apps/web/Dockerfile
            context: .
            build-args: |
              VITE_API_URL=http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build Docker image (${{ matrix.app }})
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          tags: ${{ matrix.app }}:${{ github.sha }}
          push: false
          load: false
          build-args: ${{ matrix.build-args || '' }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
