name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# A new push to the same ref makes the previous run's answer irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  # ── Job 1: static analysis — no infrastructure, so it is the fastest signal ──
  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint (includes the architectural boundary rules)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Typecheck repo scripts
        run: pnpm exec tsc --noEmit --project scripts/tsconfig.json

      - name: .env.example matches the Zod env schema
        run: pnpm check:env

      - name: OpenAPI contract has not drifted
        run: |
          pnpm --filter @repo/api generate:openapi
          pnpm --filter @repo/api-contract generate
          # --intent-to-add so a brand-new generated file shows up in git diff too.
          git add --intent-to-add .
          git diff --exit-code || {
            echo "::error::The committed OpenAPI spec or generated client is out of date."
            echo "::error::Run 'pnpm api:contract' locally and commit the result."
            exit 1
          }

  # ── Job 2: tests that need real infrastructure ──────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_db
      REDIS_URL: redis://localhost:6379
      # Test-only values. Real secrets never appear in a workflow file (doc 08 §7).
      JWT_ACCESS_SECRET: ci-access-secret-not-used-outside-ci
      JWT_REFRESH_SECRET: ci-refresh-secret-not-used-outside-ci
      INTERNAL_HMAC_SECRET: ci-hmac-secret-not-used-outside-ci

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Run migrations
        run: pnpm db:migrate

      - name: Migration drift (Drizzle schema matches the committed SQL)
        run: |
          pnpm db:generate
          git add --intent-to-add apps/api/drizzle
          git diff --exit-code apps/api/drizzle || {
            echo "::error::The Drizzle schema changed but no migration was generated for it."
            echo "::error::Run 'pnpm db:generate' locally, review the SQL, and commit apps/api/drizzle."
            exit 1
          }

      - name: Unit tests
        run: pnpm test

      - name: Integration tests (includes tenant isolation under RLS)
        run: pnpm test:integration

      - name: Coverage gate (per-area thresholds)
        run: pnpm exec tsx scripts/check-coverage.ts

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: apps/api/coverage
          if-no-files-found: ignore
          retention-days: 7

  # ── Job 3: security ─────────────────────────────────────────────────────────
  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans history, which a shallow clone does not contain.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level=high

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Job 4: the images that actually ship ────────────────────────────────────
  build:
    name: Build images
    needs: [static, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          tags: api:${{ github.sha }}
          push: false
          load: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          tags: web:${{ github.sha }}
          push: false
          load: false
          # VITE_* values are baked in at build time, so a real deployment build
          # must pass the production values here (doc 11 §6.2).
          build-args: |
            VITE_API_URL=http://localhost:3000
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
