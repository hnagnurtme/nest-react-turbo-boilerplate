name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  NODE_VERSION: '22'

jobs:
  # ── 1. Code Quality & Format ───────────────────────────────────────────────
  quality:
    name: 'CI: Code Quality'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Set up Just
        uses: extractions/setup-just@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check code formatting
        run: just format-check

      - name: Lint codebase
        run: just lint

      - name: Validate environment schemas
        run: just check-env

  # ── 2. Typecheck ────────────────────────────────────────────────────────────
  typecheck:
    name: 'CI: Type Safety'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Set up Just
        uses: extractions/setup-just@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck all workspaces
        run: just typecheck

      - name: Typecheck repository scripts
        run: just typecheck-scripts

  # ── 3. Security Audit & Secret Detection ───────────────────────────────────
  security:
    name: 'CI: Security & Audit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Set up Just
        uses: extractions/setup-just@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: just audit

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 4. Tests & Coverage (Unit, Integration & Coverage Gate) ────────────────
  test:
    name: 'CI: Tests & Coverage'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_db
      DATABASE_MIGRATION_URL: postgres://postgres:postgres@localhost:5432/test_db
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret-not-used-outside-ci
      JWT_REFRESH_SECRET: ci-refresh-secret-not-used-outside-ci
      INTERNAL_HMAC_SECRET: ci-hmac-secret-not-used-outside-ci

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Set up Just
        uses: extractions/setup-just@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @repo/shared build

      - name: Wait for Postgres to accept connections
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U postgres && break
            echo "Waiting for Postgres ($i/30)..."
            sleep 1
          done || {
            echo "::error::Postgres failed to become ready in 30 seconds."
            exit 1
          }

      - name: Wait for Redis to respond to ping
        run: |
          for i in {1..30}; do
            docker exec "${{ job.services.redis.id }}" redis-cli ping 2>/dev/null && break
            echo "Waiting for Redis ($i/30)..."
            sleep 1
          done || {
            echo "::error::Redis failed to become ready in 30 seconds."
            exit 1
          }

      - name: Apply database migrations
        run: just db-migrate

      - name: Check schema migration drift
        run: |
          just db-generate
          git add --intent-to-add apps/api/drizzle
          git diff --exit-code apps/api/drizzle || {
            echo "::error::The Drizzle schema changed but no migration was generated for it."
            echo "::error::Run 'just db-generate' locally, review the SQL, and commit apps/api/drizzle."
            exit 1
          }

      - name: Run unit tests
        run: just test

      - name: Run integration tests
        run: just test-integration

      - name: Enforce coverage thresholds
        run: just coverage
        continue-on-error: true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: apps/api/coverage
          if-no-files-found: ignore
          retention-days: 7

  # ── 5. OpenAPI Contract Drift Check ─────────────────────────────────────────
  contract-sync:
    name: 'CI: OpenAPI Contract Sync'
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_db
      DATABASE_MIGRATION_URL: postgres://postgres:postgres@localhost:5432/test_db
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret-not-used-outside-ci
      JWT_REFRESH_SECRET: ci-refresh-secret-not-used-outside-ci

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Set up Just
        uses: extractions/setup-just@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @repo/shared build

      - name: Verify contract has not drifted
        run: |
          just contract
          git add --intent-to-add .
          git diff --exit-code || {
            echo "::error::The committed OpenAPI spec or generated client is out of date."
            echo "::error::Run 'just contract' locally and commit the result."
            exit 1
          }

  # ── 6. Build Container Images (Parallel Matrix Build) ───────────────────────
  build:
    name: 'CI: Build Image (${{ matrix.app }})'
    needs: [quality, typecheck, security, test, contract-sync]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
            file: apps/api/Dockerfile
            context: .
          - app: web
            file: apps/web/Dockerfile
            context: .
            build-args: |
              VITE_API_URL=http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build Docker image (${{ matrix.app }})
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          tags: ${{ matrix.app }}:${{ github.sha }}
          push: false
          load: false
          build-args: ${{ matrix.build-args || '' }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
