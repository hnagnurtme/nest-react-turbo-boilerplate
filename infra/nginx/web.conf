# nginx site for the built Vite SPA. Mounted at /etc/nginx/conf.d/web.conf.
#
# TLS is NOT terminated here. In production this container sits behind the edge
# proxy that owns the certificate; that proxy also sets HSTS. Doing it twice
# produces conflicting headers.

server {
    listen      80;
    listen      [::]:80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # The browser sees only this proxy's address otherwise, which makes every
    # access log line useless for tracing a request back to a client.
    real_ip_header    X-Forwarded-For;
    set_real_ip_from  0.0.0.0/0;

    # ── compression ──────────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_types        text/plain text/css text/javascript
                      application/javascript application/json application/xml
                      application/wasm image/svg+xml font/woff2;

    # ── security headers ─────────────────────────────────────────────────────
    add_header X-Content-Type-Options    "nosniff"                always;
    add_header X-Frame-Options           "DENY"                   always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin"           always;

    # ── caching ──────────────────────────────────────────────────────────────
    # Vite fingerprints everything under /assets, so the content of a given URL
    # can never change. One year, immutable, no revalidation request at all.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # index.html is the one file whose URL is stable while its content changes on
    # every deploy. Caching it would pin users to a bundle that no longer exists.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
        expires -1;
        try_files $uri =404;
    }

    location = /health {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    # Other fingerprinted assets emitted outside /assets.
    location ~* \.(?:js|css|woff2?|ttf|eot|otf|svg|png|jpe?g|gif|webp|avif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    # ── SPA fallback ─────────────────────────────────────────────────────────
    # Client-side routes have no file on disk. Anything that is not a real file
    # gets index.html so the router can resolve it. This must stay last.
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
